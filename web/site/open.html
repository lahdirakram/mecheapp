<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Mèche</title>
<!--
  Passerelle mail -> app. Servie sur /ouvrir (et /open) par server.js.

  POURQUOI CETTE PAGE EXISTE : un bouton dans un email ne peut pas ouvrir l'app directement. Un lien
  `meche://` est ignoré ou masqué par une partie des clients mail (Gmail en tête), et l'app n'a pas
  d'universal links (aucun `associatedDomains` dans apps/meche/app.json, ce qui demanderait un build
  store). Un lien https, lui, est cliquable partout. Cette page fait donc le saut a la place du mail :
  elle tente le schéma custom immédiatement, et retombe sur la fiche store si l'app n'est pas là.

  Le repli est déclenché par un timer ANNULÉ quand la page passe en arrière-plan : si l'app s'ouvre,
  le navigateur perd le focus et le store ne s'affiche jamais. C'est le seul signal fiable, aucun
  navigateur ne dit "le schéma a marché".

  Bilingue comme le reste de web/ : aucune chaîne en dur dans une seule langue. La langue suit
  ?lang, puis le cookie `lang`, puis celle du NAVIGATEUR, et seulement ensuite le français.
  Sans le repli navigateur, un anglophone qui ouvre un lien sans ?lang lisait du français.
-->
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #FCF8F4; color: #15110E; padding: 32px 24px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  /* Le contenu est court : sans largeur imposée et sans corps de texte généreux, il flotte au
     milieu d'un écran vide et se lit comme une page mal zoomée. D'où la pleine largeur cadrée à
     380px et des tailles pensées pour le téléphone d'abord. */
  .card { width: 100%; max-width: 380px; text-align: center; }
  .logo { font-family: Georgia, 'Times New Roman', serif; font-size: 40px; letter-spacing: -0.5px; margin: 0 0 12px; }
  p { color: #3D342B; font-size: 18px; line-height: 1.5; margin: 0 0 28px; }
  .btn {
    display: block; width: 100%; background: #15110E; color: #FCF8F4; text-decoration: none;
    padding: 18px 24px; border-radius: 999px; font-size: 18px; font-weight: 600;
  }
  .alt { display: block; margin-top: 20px; font-size: 15px; color: #8E8580; }
</style>
</head>
<body>
  <div class="card">
    <p class="logo">Mèche</p>
    <p id="msg"></p>
    <a class="btn" id="cta" href="#"></a>
    <a class="alt" id="store" href="#"></a>
  </div>
<script>
(function () {
  var T = {
    fr: { msg: 'Ouverture de l’app...', cta: 'Ouvrir Mèche', store: 'Installer l’app' },
    en: { msg: 'Opening the app...', cta: 'Open Mèche', store: 'Get the app' }
  };
  // Même ordre de priorité que le reste du site (voir pickLang dans server.js), rejoué ici en JS
  // parce que cette page est un fichier UNIQUE et non deux copies : ?lang -> cookie `lang` (un
  // choix explicite déjà fait sur le site) -> langue du navigateur -> fr.
  // Le ?lang garde la priorité : quand le mail le pose, il sait dans quelle langue il a été écrit,
  // ce qui est une meilleure information que les réglages du téléphone.
  function pickLang() {
    var q = new URLSearchParams(location.search).get('lang');
    if (q === 'en' || q === 'fr') return q;
    var c = /(?:^|;\s*)lang=(fr|en)(?:;|$)/.exec(document.cookie || '');
    if (c) return c[1];
    // navigator.languages est la liste ORDONNÉE des préférences : on prend la première qu'on
    // parle, pas la première de la liste. Un navigateur en 'de-DE,en-GB' doit donner l'anglais.
    var list = (navigator.languages && navigator.languages.length)
      ? navigator.languages
      : [navigator.language || ''];
    for (var i = 0; i < list.length; i++) {
      var l = String(list[i]).toLowerCase();
      if (l.indexOf('fr') === 0) return 'fr';
      if (l.indexOf('en') === 0) return 'en';
    }
    return 'fr';
  }
  var lang = pickLang();
  document.documentElement.lang = lang;
  var t = T[lang];
  document.getElementById('msg').textContent = t.msg;

  var SCHEME = 'meche://';
  var APPSTORE = 'https://apps.apple.com/app/id6777728552';
  var PLAY = 'https://play.google.com/store/apps/details?id=com.meche.app';
  var ua = navigator.userAgent || '';
  var isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var isAndroid = /Android/.test(ua);
  // Sur ordinateur il n'y a rien à installer ici : on renvoie vers la page de téléchargement, qui
  // montre les deux stores, plutôt que vers la landing.
  var storeUrl = isAndroid ? PLAY : isIOS ? APPSTORE : (lang === 'en' ? '/en/download' : '/fr/download');

  var cta = document.getElementById('cta');
  cta.textContent = t.cta;
  cta.href = SCHEME;
  var store = document.getElementById('store');
  store.textContent = t.store;
  store.href = storeUrl;

  // Sur ordinateur il n'y a pas d'app à ouvrir : on ne tente rien, on montre la page.
  if (!isIOS && !isAndroid) return;

  var timer = setTimeout(function () { location.replace(storeUrl); }, 1500);
  // L'app a pris la main (onglet caché ou page mise en cache) : surtout ne pas envoyer au store.
  var cancel = function () { clearTimeout(timer); };
  document.addEventListener('visibilitychange', function () { if (document.hidden) cancel(); });
  window.addEventListener('pagehide', cancel);
  window.addEventListener('blur', cancel);
  location.href = SCHEME;
})();
</script>
</body>
</html>
